<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vending Machine — live simulation — Subroute</title>
    <style>
      :root {
        --bg: #0c0d10; --surface: #14161a; --elevated: #1a1d22;
        --border: #232830; --border-strong: #2d333d;
        --fg: #e8e4dc; --muted: #9099a8; --subtle: #6b7280;
        --accent: #fb863a; --accent-soft: rgba(251,134,58,.12); --accent-border: rgba(251,134,58,.45);
        --success: #5cc66f; --success-soft: rgba(92,198,111,.12);
        --info: #5e9ff6; --info-soft: rgba(94,159,246,.12);
        --danger: #f06868; --danger-soft: rgba(240,104,104,.12);
        --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
        --r-md: 8px; --r-lg: 12px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
      body {
        padding: 14px 16px 20px;
        background-image:
          linear-gradient(to right, rgba(255,255,255,.022) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,.022) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* state strip */
      .states { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 9px; }
      .st { font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px;
            background: var(--surface); border: 1px solid var(--border); color: var(--subtle); white-space: nowrap; transition: all .2s; }
      .st.on { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
      .st-arrow { color: var(--subtle); font-family: var(--mono); font-size: 10px; }

      .callline { font-family: var(--mono); font-size: 11.5px; color: var(--subtle); background: #0a0b0e;
                  border: 1px solid var(--border); border-radius: var(--r-md); padding: 7px 11px; margin-bottom: 10px;
                  white-space: nowrap; overflow-x: auto; }
      .callline b { color: var(--accent); }
      .callline i { color: var(--success); font-style: normal; }
      .callline u { color: var(--danger); text-decoration: none; }

      .cols { display: grid; grid-template-columns: 1fr 250px; gap: 10px; align-items: start; }
      .pane { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 11px; }
      .cap { font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
             color: var(--subtle); margin-bottom: 9px; display: flex; justify-content: space-between; gap: 8px; }

      /* shelf */
      .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .slot { background: var(--elevated); border: 1px solid var(--border-strong); border-radius: var(--r-md);
              padding: 9px 8px; cursor: pointer; text-align: center; position: relative; transition: border-color .15s, transform .1s, opacity .2s; }
      .slot:hover { border-color: var(--accent); }
      .slot:active { transform: scale(.98); }
      .slot .code { position: absolute; top: 4px; left: 6px; font-family: var(--mono); font-size: 8px; color: var(--subtle); }
      .slot .stk { position: absolute; top: 4px; right: 6px; font-family: var(--mono); font-size: 8px; color: var(--muted); }
      .slot .ico { font-size: 22px; line-height: 1; margin: 8px 0 4px; }
      .slot .nm { font-family: var(--mono); font-size: 10px; color: var(--fg); }
      .slot .pr { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); margin-top: 2px; }
      .slot.out { opacity: .4; cursor: not-allowed; border-style: dashed; }
      .slot.out:hover { border-color: var(--border-strong); }
      .slot.afford { border-color: rgba(92,198,111,.5); }
      .slot.shake { animation: shake .32s; border-color: var(--danger); }
      .slot.picked { border-color: var(--accent); background: var(--accent-soft); }
      @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

      /* lcd */
      .lcd { background: #0a0b0e; border: 1px solid var(--border-strong); border-radius: var(--r-md);
             padding: 10px 12px; margin-bottom: 10px; font-family: var(--mono); }
      .lcd .msg { font-size: 12px; color: var(--success); min-height: 16px; }
      .lcd .bal { font-size: 19px; font-weight: 700; color: var(--fg); margin-top: 5px; }
      .lcd .bal span { font-size: 10px; color: var(--muted); font-weight: 400; }
      .lcd.err .msg { color: var(--danger); }

      /* coins */
      .coins { display: flex; gap: 5px; flex-wrap: wrap; }
      .coin { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 8px 0; width: 52px;
              border-radius: 50px; background: var(--elevated); border: 1px solid var(--border-strong);
              color: var(--fg); cursor: pointer; transition: transform .1s, border-color .15s; }
      .coin:hover { border-color: var(--accent); }
      .coin:active { transform: scale(.94); }

      .bank { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
      .bk { font-family: var(--mono); font-size: 9.5px; padding: 4px 7px; border-radius: 5px;
            background: var(--elevated); border: 1px solid var(--border); color: var(--muted); }
      .bk.zero { color: var(--danger); border-color: rgba(240,104,104,.4); }

      /* tray */
      .tray { margin-top: 10px; min-height: 62px; background: #0a0b0e; border: 1px dashed var(--border-strong);
              border-radius: var(--r-md); padding: 9px 11px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
      .tray .ph { font-family: var(--mono); font-size: 10.5px; color: var(--subtle); }
      .drop { font-size: 24px; animation: drop .45s ease-out; }
      @keyframes drop { from { transform: translateY(-22px); opacity: 0; } }
      .chg { font-family: var(--mono); font-size: 10.5px; padding: 5px 9px; border-radius: 50px;
             background: var(--success-soft); border: 1px solid rgba(92,198,111,.45); color: var(--success); animation: drop .45s ease-out; }

      .explain { min-height: 72px; background: #0a0b0e; border: 1px solid var(--border); border-radius: var(--r-md);
                 padding: 12px 15px; margin-top: 11px; display: flex; flex-direction: column; justify-content: center; }
      .explain-title { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 5px; }
      .explain-body { font-size: 13px; line-height: 1.6; color: var(--fg); }
      .explain-body code { font-family: var(--mono); background: var(--elevated); color: var(--fg); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
      .explain-body .dim { color: var(--muted); }
      .explain-body .good { color: var(--success); font-weight: 700; }
      .explain-body .bad { color: var(--danger); font-weight: 700; }
      .explain-body .hi { color: var(--accent); font-weight: 700; }

      .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 11px; }
      .btn { background: var(--elevated); color: var(--muted); font: 600 11.5px/1 var(--sans);
             border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px 12px; cursor: pointer; }
      .btn:hover { border-color: var(--border-strong); color: var(--fg); }
      .btn.on { background: var(--danger-soft); border-color: rgba(240,104,104,.45); color: var(--danger); }
      .hint { margin-left: auto; font-size: 11.5px; color: var(--muted); }
      .hint .b { color: var(--accent); }

      @media (max-width: 620px) { .cols { grid-template-columns: 1fr; } .hint { margin-left: 0; } }
    </style>
  </head>
  <body>
    <div class="states" id="states"></div>
    <div class="callline" id="callline">// insert a coin to leave <b>IDLE</b></div>

    <div class="cols">
      <div class="pane">
        <div class="cap"><span>Shelf</span><span id="cap-hint">tap a slot to buy</span></div>
        <div class="shelf" id="shelf"></div>
        <div class="tray" id="tray"><span class="ph">— collection tray —</span></div>
      </div>

      <div class="pane">
        <div class="lcd" id="lcd">
          <div class="msg" id="lcd-msg">INSERT COIN</div>
          <div class="bal" id="lcd-bal">₹0<span> credit</span></div>
        </div>
        <div class="cap"><span>Insert</span></div>
        <div class="coins" id="coins"></div>
        <div class="cap" style="margin-top:11px"><span>Machine’s coins</span></div>
        <div class="bank" id="bank"></div>
      </div>
    </div>

    <div class="explain">
      <div class="explain-title" id="ex-title">State: IDLE</div>
      <div class="explain-body" id="ex-body">Insert a coin. Watch which <b>state</b> the machine moves to — every button behaves differently in each one.</div>
    </div>

    <div class="foot">
      <button class="btn" id="refund-btn">↩ Coin return</button>
      <button class="btn" id="lowchange-btn">💰 Empty the coin bank</button>
      <button class="btn" id="reset-btn">↺ Reset</button>
      <span class="hint"><span class="b">▸</span> Try buying <b>before</b> paying — the state refuses you.</span>
    </div>

    <script>
      var COINS = [5, 10, 20, 50];
      var PRODUCTS = [
        { code: "A1", name: "Cola",   icon: "🥤", price: 25, stock: 2 },
        { code: "A2", name: "Chips",  icon: "🍟", price: 20, stock: 2 },
        { code: "A3", name: "Candy",  icon: "🍬", price: 15, stock: 1 },
        { code: "B1", name: "Water",  icon: "💧", price: 10, stock: 3 },
        { code: "B2", name: "Cookie", icon: "🍪", price: 35, stock: 1 },
        { code: "B3", name: "Gum",    icon: "🍫", price: 5,  stock: 0 }
      ];
      var STATES = ["IDLE", "HAS_MONEY", "DISPENSING", "CHANGE"];

      var products, bank, balance, state, busy;

      function setExplain(t, h) {
        document.getElementById("ex-title").textContent = t;
        document.getElementById("ex-body").innerHTML = h;
      }
      function setCall(h) { document.getElementById("callline").innerHTML = h; }
      function lcd(msg, err) {
        document.getElementById("lcd-msg").textContent = msg;
        document.getElementById("lcd-bal").innerHTML = "₹" + balance + "<span> credit</span>";
        document.getElementById("lcd").className = err ? "lcd err" : "lcd";
      }

      function renderStates() {
        var host = document.getElementById("states");
        host.innerHTML = "";
        STATES.forEach(function (s, i) {
          if (i) {
            var a = document.createElement("span");
            a.className = "st-arrow"; a.textContent = "→";
            host.appendChild(a);
          }
          var el = document.createElement("span");
          el.className = "st" + (state === s ? " on" : "");
          el.textContent = s;
          host.appendChild(el);
        });
      }

      function renderShelf() {
        var host = document.getElementById("shelf");
        host.innerHTML = "";
        products.forEach(function (p) {
          var el = document.createElement("button");
          var cls = "slot";
          if (p.stock === 0) cls += " out";
          else if (state === "HAS_MONEY" && balance >= p.price) cls += " afford";
          el.className = cls;
          el.id = "sl-" + p.code;
          el.innerHTML =
            "<span class='code'>" + p.code + "</span>" +
            "<span class='stk'>×" + p.stock + "</span>" +
            "<span class='ico'>" + (p.stock ? p.icon : "🚫") + "</span>" +
            "<span class='nm'>" + p.name + "</span>" +
            "<span class='pr'>₹" + p.price + "</span>";
          el.addEventListener("click", function () { select(p.code); });
          host.appendChild(el);
        });
      }

      function renderCoins() {
        var host = document.getElementById("coins");
        host.innerHTML = "";
        COINS.forEach(function (c) {
          var b = document.createElement("button");
          b.className = "coin";
          b.textContent = "₹" + c;
          b.addEventListener("click", function () { insert(c); });
          host.appendChild(b);
        });
        var bk = document.getElementById("bank");
        bk.innerHTML = "";
        COINS.forEach(function (c) {
          var s = document.createElement("span");
          s.className = "bk" + (bank[c] === 0 ? " zero" : "");
          s.textContent = "₹" + c + " ×" + bank[c];
          bk.appendChild(s);
        });
      }

      function render() { renderStates(); renderShelf(); renderCoins(); }

      function trayReset() {
        document.getElementById("tray").innerHTML = "<span class='ph'>— collection tray —</span>";
      }
      function trayAdd(html) {
        var t = document.getElementById("tray");
        if (t.querySelector(".ph")) t.innerHTML = "";
        var s = document.createElement("span");
        s.innerHTML = html;
        t.appendChild(s.firstChild);
      }

      /* ---- greedy change from the machine's own coins ---- */
      function makeChange(amount) {
        var give = {}, left = amount;
        for (var i = COINS.length - 1; i >= 0; i--) {
          var c = COINS[i], n = Math.min(Math.floor(left / c), bank[c]);
          if (n > 0) { give[c] = n; left -= n * c; }
        }
        return left === 0 ? give : null;     // null == cannot make exact change
      }

      /* ---- transitions ---- */
      function insert(c) {
        if (busy) return;
        balance += c;
        bank[c] = bank[c] + 1;
        state = "HAS_MONEY";
        render();
        lcd("CREDIT ₹" + balance, false);
        setCall("machine.<b>insertCoin</b>(" + c + ")  <span style='color:#6b7280'>// state: HAS_MONEY</span>");
        setExplain("State: HAS_MONEY",
          "Credit is <span class='hi'>₹" + balance + "</span>. <span class='dim'>Affordable slots just turned green — the same button means something different now.</span>");
      }

      function select(code) {
        if (busy) return;
        var p = null, i;
        for (i = 0; i < products.length; i++) if (products[i].code === code) p = products[i];
        if (!p) return;
        var el = document.getElementById("sl-" + code);

        if (p.stock === 0) {
          if (el) { el.classList.add("shake"); setTimeout(function () { el.classList.remove("shake"); }, 340); }
          lcd("SOLD OUT", true);
          setCall("machine.select(“" + code + "”) → <u>SoldOutException</u>");
          setExplain("Sold out",
            "<code>" + code + "</code> has <span class='bad'>0</span> left. <span class='dim'>Stock is checked before the money moves — never after.</span>");
          return;
        }

        if (state === "IDLE") {
          if (el) { el.classList.add("shake"); setTimeout(function () { el.classList.remove("shake"); }, 340); }
          lcd("INSERT COIN FIRST", true);
          setCall("machine.select(“" + code + "”) → <u>rejected in state IDLE</u>");
          setExplain("Refused — wrong state",
            "In <span class='hi'>IDLE</span> the machine ignores product buttons. <span class='dim'>The state, not an <code>if</code> pile, decides what is legal.</span>");
          return;
        }

        if (balance < p.price) {
          if (el) { el.classList.add("shake"); setTimeout(function () { el.classList.remove("shake"); }, 340); }
          lcd("NEED ₹" + (p.price - balance) + " MORE", true);
          setCall("machine.select(“" + code + "”) → <u>InsufficientCredit</u>");
          setExplain("Not enough credit",
            "<code>" + p.name + "</code> costs <span class='hi'>₹" + p.price + "</span>, you have ₹" + balance +
            ". <span class='dim'>Stay in HAS_MONEY and keep the coins.</span>");
          return;
        }

        // -- can we even give change? check BEFORE dispensing --
        var due = balance - p.price;
        var change = due === 0 ? {} : makeChange(due);
        if (change === null) {
          lcd("EXACT CHANGE ONLY", true);
          setCall("machine.select(“" + code + "”) → <u>CannotMakeChange(₹" + due + ")</u>");
          setExplain("Cannot make ₹" + due + " change",
            "The coin bank cannot build that amount. <span class='dim'>Check change <b>before</b> dropping the item — a machine that dispenses then fails owes the customer money.</span>");
          return;
        }

        busy = true;
        state = "DISPENSING";
        if (el) el.classList.add("picked");
        render();
        lcd("DISPENSING…", false);
        setCall("machine.<b>select</b>(“" + code + "”)  <span style='color:#6b7280'>// state: DISPENSING</span>");
        setExplain("State: DISPENSING",
          "Stock drops <span class='hi'>" + p.stock + " → " + (p.stock - 1) + "</span> and ₹" + p.price +
          " is taken from the credit. <span class='dim'>Both happen together, or neither does.</span>");

        setTimeout(function () {
          p.stock--;
          balance -= p.price;
          trayReset();
          trayAdd("<span class='drop'>" + p.icon + "</span>");
          state = "CHANGE";
          render();
          lcd(due ? "CHANGE ₹" + due : "THANK YOU", false);
          setExplain("State: CHANGE",
            due === 0
              ? "Exact money — <span class='good'>no change owed</span>. <span class='dim'>Straight back to IDLE.</span>"
              : "Owed <span class='hi'>₹" + due + "</span>. <span class='dim'>Greedy: biggest coin first, but only what the bank actually holds.</span>");

          setTimeout(function () {
            var parts = [];
            for (var i = COINS.length - 1; i >= 0; i--) {
              var c = COINS[i];
              if (change[c]) {
                bank[c] -= change[c];
                parts.push("₹" + c + " ×" + change[c]);
                trayAdd("<span class='chg'>₹" + c + " ×" + change[c] + "</span>");
              }
            }
            balance = 0;
            state = "IDLE";
            busy = false;
            render();
            lcd("INSERT COIN", false);
            setCall("select(“" + code + "”) → <i>" + p.name + (due ? " + ₹" + due + " change" : "") + "</i>");
            setExplain("Back to IDLE",
              due === 0
                ? "Item collected, credit <span class='good'>₹0</span>. <span class='dim'>One full loop: IDLE → HAS_MONEY → DISPENSING → CHANGE → IDLE.</span>"
                : "Returned <span class='good'>" + parts.join(" + ") + "</span>. <span class='dim'>The bank shrank — that is why the next customer may hit “exact change only”.</span>");
          }, 620);
        }, 620);
      }

      function refund() {
        if (busy) return;
        if (balance === 0) {
          lcd("NOTHING TO RETURN", true);
          setExplain("Nothing to return",
            "Credit is already <span class='hi'>₹0</span>. <span class='dim'>In IDLE this button is a no-op — also a legal transition.</span>");
          return;
        }
        var give = makeChange(balance);
        trayReset();
        var amt = balance;
        if (give) {
          for (var i = COINS.length - 1; i >= 0; i--) {
            var c = COINS[i];
            if (give[c]) { bank[c] -= give[c]; trayAdd("<span class='chg'>₹" + c + " ×" + give[c] + "</span>"); }
          }
        } else {
          trayAdd("<span class='chg'>₹" + amt + "</span>");
        }
        balance = 0;
        state = "IDLE";
        render();
        lcd("INSERT COIN", false);
        setCall("machine.<b>refund</b>() → <i>₹" + amt + "</i>  <span style='color:#6b7280'>// state: IDLE</span>");
        setExplain("Refunded ₹" + amt,
          "Credit back to <span class='good'>₹0</span> and the machine returns to <span class='hi'>IDLE</span>. " +
          "<span class='dim'>Every state needs an escape hatch, or money gets stuck inside.</span>");
      }

      function emptyBank() {
        if (busy) return;
        COINS.forEach(function (c) { bank[c] = 0; });
        render();
        setCall("// coin bank emptied — now overpay for something");
        setExplain("Coin bank empty",
          "Insert <span class='hi'>₹50</span> and buy the <span class='hi'>₹15</span> candy. <span class='dim'>The machine must refuse <b>before</b> it drops the item.</span>");
      }

      function reset() {
        products = PRODUCTS.map(function (p) {
          return { code: p.code, name: p.name, icon: p.icon, price: p.price, stock: p.stock };
        });
        bank = { 5: 2, 10: 2, 20: 1, 50: 0 };
        balance = 0; state = "IDLE"; busy = false;
        render();
        trayReset();
        lcd("INSERT COIN", false);
        setCall("// insert a coin to leave <b>IDLE</b>");
        setExplain("State: IDLE",
          "Insert a coin. Watch which <b>state</b> the machine moves to — every button behaves differently in each one.");
      }

      document.getElementById("refund-btn").addEventListener("click", refund);
      document.getElementById("lowchange-btn").addEventListener("click", emptyBank);
      document.getElementById("reset-btn").addEventListener("click", reset);
      reset();
    </script>
    <script>(function(){function p(){var h=Math.ceil(Math.max(document.body.scrollHeight,document.body.getBoundingClientRect().height));parent.postMessage({type:"prototype:height",height:h},"*");}if(window.ResizeObserver)new ResizeObserver(p).observe(document.body);window.addEventListener("load",p);})();</script>
  </body>
</html>
